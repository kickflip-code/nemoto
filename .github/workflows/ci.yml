# Public Core gate. Runs the same `npm run verify:core` command that the
# README documents, on a clean Windows x64 machine (the supported beta target).
# `verify:core` is defined in the exported public package.json; this workflow
# is published through scripts/prepare-public-core.mjs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core-windows:
    name: verify:core (Windows x64)
    # verify:core exists only in the exported public package.json.
    if: github.repository == 'kickflip-code/nemoto'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Core
        run: npm run verify:core
